[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read-write", path = "./" }]
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]
# Fork tests are opt-in: forge test --match-path 'test/fork/*' --fork-url $BSC_RPC_URL
no_match_path = "test/fork/*"

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 128
depth = 32
fail_on_revert = false

[profile.ci.fuzz]
runs = 2048

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false

[rpc_endpoints]
bsc = "${BSC_RPC_URL}"
bsc_testnet = "${BSC_TESTNET_RPC_URL}"
fork = "${FORK_RPC_URL}"

[etherscan]
bsc = { key = "${BSCSCAN_API_KEY}", chain = 56 }
bsc_testnet = { key = "${BSCSCAN_API_KEY}", chain = 97 }


# >>> fizz fuzz profile
[profile.fuzz]
via_ir = true
optimizer = false
optimizer_runs = 0
# <<< fizz fuzz profile
